name: venera_patch
description: Hot-update runtime for Venera — kill switches, config overlays, patch loading.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  path: ^1.9.0
  pointycastle: ^4.0.0
  # The interpreter. Kept a separate package so its audit surface stays small
  # and readable: it is the only part of this stack that executes payload-shaped
  # input, and it deliberately has no dependencies of its own.
  venera_patch_vm:
    path: ../venera_patch_vm

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
