name: venera_patch_vm
description: Interpreter for Venera hot-update patches — closure-tree IR over slot frames.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'

# Deliberately dependency-free.
#
# This package is the only thing from the hot-update stack that ships inside the
# app and executes untrusted-shaped input, so its audit surface has to stay
# small enough to actually read. The compiler (which needs `analyzer`) lives in a
# separate package that never enters a release build.
dependencies:

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
