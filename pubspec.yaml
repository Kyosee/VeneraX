name: venera
description: "A comic app."
publish_to: 'none'

version: 3.0.1+260

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.3 <3.45.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: 2.1.6
  intl: any
  window_manager: ^0.5.2
  sqlite3: ^2.7.4
  sqlite3_flutter_libs: ^0.5.30
  flutter_qjs:
    git:
      url: https://github.com/Kyosee/flutter_qjs
      ref: 8feae95df7fb00455df129ad7a0dfec1d0e8d8e4
  crypto: ^3.0.8
  dio: ^5.11.1
  html: ^0.15.7
  xml: ^6.6.1
  pointycastle: ^4.0.0
  url_launcher: ^6.3.3
  path: ^1.9.0
  photo_view:
    path: packages/photo_view
  mime: ^2.1.0
  share_plus: ^12.0.1
  scrollable_positioned_list:
    path: packages/scrollable_positioned_list
  flutter_reorderable_grid_view: ^5.10.0
  uuid: ^4.6.0
  desktop_webview_window:
    git:
      url: https://github.com/Kyosee/flutter_desktop_webview
      path: packages/desktop_webview_window
      ref: 7801fc582ecf5a7351632887891ecf309a7b2583
  flutter_inappwebview:
    git:
      url: https://github.com/Kyosee/flutter_inappwebview
      path: flutter_inappwebview
      ref: 3ef899b3db57c911b080979f1392253b835f98ab
  app_links: ^7.2.2
  sliver_tools: ^0.2.12
  flutter_file_dialog: ^3.3.6
  file_selector: ^1.1.0
  zip_flutter: ^0.0.13
  lodepng_flutter:
    git:
      url: https://github.com/Kyosee/lodepng_flutter
      ref: c46484288a93d47cd0e6508e2cb7e5c87c167527
  flutter_rust_bridge: 2.12.0
  rhttp: 0.16.0
  webdav_client:
    path: packages/webdav_client
  battery_plus: ^7.1.2
  # Pinned to 7.0.0: 7.1.x references NWPath.isUltraConstrained, an iOS/macOS 26
  # SDK symbol guarded only at runtime, so it fails to compile on the Xcode 16.4
  # toolchain our CI uses. Stay below 7.1.0 until the build toolchain ships the
  # iOS 26 SDK.
  connectivity_plus: 7.0.0
  local_auth: ^3.0.2
  flutter_saf:
    git: 
      url: https://github.com/Kyosee/flutter_saf
      ref: fe182cdf40e5fa6230f451bc1d643b860f610d13
  dynamic_color: ^1.8.1
  shimmer_animation: ^2.1.0
  flutter_memory_info: ^0.0.3
  syntax_highlight: ^0.4.0
  flutter_7zip:
    git:
      url: https://github.com/Kyosee/flutter_7zip
      ref: 26089e4977462bd3ad46142a807a20d0edb4207f
  flex_seed_scheme: ^4.0.1
  flutter_localizations:
    sdk: flutter
  yaml: ^3.1.4
  package_info_plus: ^8.3.1
  enough_convert: ^1.7.1
  display_mode: ^0.0.2
  flutter_staggered_grid_view: ^0.7.0
  archive: 4.7.1
  tray_manager: ^0.5.3
  flutter_slidable: ^4.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  # 1.8.3 with the iOS minimum lowered from 16.0 to 15.1, matching ONNX Runtime 1.23.
  # Linux and Windows can fall back to Microsoft's same-version NuGet package.
  flutter_onnxruntime:
    git:
      url: https://github.com/Kyosee/flutter_onnxruntime
      ref: 2c79916b1a1a182280fec00def15b9cf3b0ee831
  unorm_dart: ^0.3.3
  ffi: ^2.2.0
  pdfrx_engine: ^0.4.3
  # Supplies PDFium on all native platforms, including the Apple XCFramework.
  pdfium_flutter: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_to_arch: ^1.0.1
  flutter_to_debian:
    git:
      url: https://github.com/Kyosee/flutter_to_debian.git
      ref: 3777c91b6b1cc0b7c03357c67ca216d4313c3db5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/new_logo.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/new_logo.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/translation.json
    - assets/init.js
    - assets/app_icon.png
    - assets/app_icon.ico
    - assets/tags.json
    - assets/tags_tw.json
    - assets/opencc.txt
    - assets/new_logo.png
    - assets/new_logo2.png
    - assets/new_logo3.png
    - assets/user_logo.png
    - assets/venera_original.png
    - assets/new_logo2.ico
    - assets/new_logo3.ico
    - assets/user_logo.ico
    - assets/venera_original.ico
    # User guide, authored once and read both here and on the repo page.
    - doc/guide.zh.md
    - doc/guide.en.md
    # Bundled so the import help works offline and outlives the repo page.
    - doc/import_comic.md
  shaders:
    - shaders/image_enhance.frag
# fonts:

flutter_to_arch:
  name: Venera
  icon: debian/gui/venera.png
  categories: Utility
  keywords: Flutter;comic;images;
  url: https://github.com/Kyosee/VeneraX
  depends:
    - gtk3
    - webkit2gtk-4.1
    - libayatana-appindicator
