plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

// Flutter forwards the selected Dart entry point as the Gradle target.
def flutterRoot = rootProject.projectDir.parentFile
def targetFile = new File(project.findProperty("target") ?: "lib/main.dart")
if (!targetFile.isAbsolute()) {
    targetFile = new File(flutterRoot, targetFile.path)
}
def tvBuild = targetFile.canonicalFile == new File(flutterRoot, "lib/main_tv.dart").canonicalFile
def apkName = tvBuild ? "VeneraX-TV" : "VeneraX"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def releaseStoreFile
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
        def value = keystoreProperties[key]
        if (value == null || value.toString().trim().isEmpty()) {
            throw new GradleException("Missing android/key.properties value: ${key}")
        }
    }
    releaseStoreFile = rootProject.file(keystoreProperties["storeFile"])
    if (!releaseStoreFile.isFile()) {
        throw new GradleException("Missing Android release keystore file: ${releaseStoreFile}")
    }
} else {
    // Both APK and bundle packaging depend on the release pre-build task.
    tasks.matching { it.name in ["preReleaseBuild", "validateSigningRelease"] }.configureEach {
        doFirst { throw new GradleException("Missing android/key.properties for release signing") }
    }
}

android {
    namespace = "io.github.kyosee.venera"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            enable true
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
        if (releaseStoreFile) {
            debug.initWith(release)
        }
    }

    defaultConfig {
        applicationId = tvBuild ? "io.github.kyosee.venera.tv" : "io.github.kyosee.venera"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // flutter_onnxruntime: keep the ONNX Runtime Java API from R8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.release
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (variant.buildType.name == "release") {
                if (abi != null) {
                    outputFileName = "${apkName}-${variant.versionName}-${abi}.apk"
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) {
                        versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                    }
                } else {
                    outputFileName = "${apkName}-${variant.versionName}.apk"
                    versionCodeOverride = variant.versionCode * 10
                }
            } else if (variant.buildType.name == "debug") {
                versionCodeOverride = variant.versionCode * 10 + 4
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

if (tvBuild) {
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
        variant.sources.manifests.addStaticManifestFile("src/tv/AndroidManifest.xml")
        variant.sources.res.addStaticSourceDirectory("src/tv/res")
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // 提供 NotificationCompat 与 ContextCompat.startForegroundService，供后台下载前台服务使用。
    implementation 'androidx.core:core-ktx:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}
