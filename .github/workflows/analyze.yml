name: "analyze"
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Issue triage
        run: node --test .github/scripts/issue-triage.test.mjs
      - name: Check AppImage packaging
        run: |
          python3 -m unittest discover -s debian -p 'test_*.py'
          python3 -m unittest discover -s linux/appimage -p 'test_*.py'
          bash -n linux/appimage/AppRun
          bash -n linux/appimage/smoke_test.sh
          python3 -m py_compile linux/appimage/smoke_test.py
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: '3.44.3'
          architecture: x64
      - run: flutter pub get --enforce-lockfile
      # System pip on ubuntu-latest refuses installs (PEP 668).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check incremental updates
        run: |
          python -m pip install --disable-pip-version-check bsdiff4==1.2.6
          python -m unittest discover -s tool -p test_create_update_deltas.py
          python -m unittest discover -s tool -p test_build_update_deltas.py
          node --test .github/scripts/release-assets.test.mjs
          flutter test --no-pub test/update_bsdiff_test.dart test/update_delta_test.dart test/app_update_download_test.dart test/app_update_dialog_test.dart test/windows_update_install_test.dart test/windows_updater_test.dart
      - uses: invertase/github-action-dart-analyzer@v3
      - name: Check maintained packages and reader integration
        run: >-
          flutter test --no-pub
          packages/photo_view/test
          packages/scrollable_positioned_list/test
          test/photo_view_lifecycle_test.dart
          test/reader_rotation_transition_test.dart
          test/continuous_reader_navigation_test.dart
          test/continuous_reader_repivot_test.dart
          test/continuous_reader_rtl_test.dart
          test/webdav_client_protocol_test.dart
          test/webdav_library_test.dart
          test/webdav_linked_folder_test.dart
          test/webdav_upload_test.dart
          test/webdav_saf_upload_test.dart
