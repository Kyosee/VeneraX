name: "analyze"
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check AppImage packaging
        run: |
          python3 -m unittest discover -s linux/appimage -p 'test_*.py'
          bash -n linux/appimage/AppRun
          bash -n linux/appimage/smoke_test.sh
          python3 -m py_compile linux/appimage/smoke_test.py
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: flutter pub get
      - uses: invertase/github-action-dart-analyzer@v3
