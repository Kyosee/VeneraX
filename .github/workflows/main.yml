name: Build ALL
run-name: ${{ github.event_name == 'schedule' && 'Warm native dependencies' || inputs.platform && format('Build {0}', inputs.platform) || 'Build ALL' }}
on:
  schedule:
    - cron: '37 2 * * 1,4'
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (release always builds all)"
        type: choice
        default: all
        required: false
        options:
          - all
          - ios
          - android
          - windows
          - macos
          - linux
          - harmonyos
          - native-cache
          - mobile-preview
      appimage_run_id:
        description: "Existing build run to test AppImages without rebuilding (platform: linux)"
        type: string
        required: false

permissions:
  contents: write

# A newer release tag supersedes any still-running older release build. Manual
# build-only dispatches use a unique group and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  Build_MacOS:
    runs-on: macos-15
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: '3.44.3'
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: apple
      - run: flutter pub get
        # Step 1: Decode and install the certificate
      - name: Decode and install certificate
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ] && [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "macOS signing secrets are not configured; building unsigned macOS app."
            exit 0
          fi
          test -n "$CERTIFICATE" || { echo "CERTIFICATE secret is missing"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "CERTIFICATE_PASSWORD secret is missing"; exit 1; }
          echo "$CERTIFICATE" | base64 --decode > signing_certificate.p12
          security import signing_certificate.p12 -k ~/Library/Keychains/login.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign

      - name: Check rust-toolchain.toml
        run: rustup show

      # Step 2: Build the Flutter macOS app
      - name: Build Flutter macOS App
        run: flutter build macos --release
      - name: Report native target timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 .github/scripts/desktop_build_timings.py

      # Step 3: Create the DMG file
      - name: Create DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          # Rename only the bundle directory: CFBundleExecutable still points at
          # the `venera` binary inside, and the signature covers the contents,
          # not the enclosing folder name.
          cp -R build/macos/Build/Products/Release/venera.app dist/dmg_contents/VeneraX.app
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "VeneraX" -srcfolder dist/dmg_contents -ov -format UDZO "dist/VeneraX.dmg"

      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv dist/VeneraX.dmg result/VeneraX-$APP_VERSION.dmg

      # Step 4: Attach and upload artifacts (optional)
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos_build
          path: result/
  Build_IOS:
    # The iOS 27.1 SDK enables the full iPhone Duo display.
    runs-on: xcode-27
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: '3.44.3'
          architecture: arm64
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.1.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: apple
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -r VeneraX-ios.ipa Payload
      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv build/ios/iphoneos/VeneraX-ios.ipa result/VeneraX-ios-$APP_VERSION.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: ios_build
          path: result/
  Build_Android:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' || inputs.platform == 'mobile-preview' }}
    steps:
      - uses: actions/checkout@v7
      - run: rm -rf /opt/hostedtoolcache
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: android
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: '3.44.3'
          architecture: x64
      - name: Verify Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
            set -euo pipefail
            test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
            test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
            test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing"; exit 1; }
            test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing"; exit 1; }
      - name: Decode and install Android signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
            {
              printf 'storeFile=keystore.jks\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > android/key.properties
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
      - run: flutter pub get
      - name: Prepare published Android rhttp
        run: bash .github/scripts/android-rhttp.sh
      - run: flutter build apk --release
      - name: Verify packaged rhttp libraries
        if: env.VENERAX_ANDROID_RHTTP != ''
        run: |
          set -euo pipefail
          if [[ ! -f "$VENERAX_ANDROID_RHTTP/used" ]]; then
            echo "CargoKit built rhttp for the configured NDK and minimum Android API."
            exit 0
          fi
          libs=$(cat "$VENERAX_ANDROID_RHTTP/used")
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          apk="build/app/outputs/apk/release/VeneraX-$version"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            for file in "$apk.apk" "$apk-$abi.apk"; do
              unzip -p "$file" "lib/$abi/librhttp.so" | cmp "$libs/$abi/librhttp.so" -
              echo "Verified $abi in $(basename "$file")"
            done
          done
      - name: Verify Android signature continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The universal APK is the ABI-less output; per-ABI ones carry an
          # -<abi> suffix (android/app/build.gradle outputFileName).
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          version="${version%%+*}"
          test -n "$version" || { echo "Missing version in pubspec.yaml"; exit 1; }
          current_apk="build/app/outputs/apk/release/VeneraX-${version}.apk"
          test -s "$current_apk" || {
            echo "Missing universal APK: $current_apk"
            ls -1 build/app/outputs/apk/release || true
            exit 1
          }
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)
          test -n "$apksigner" || { echo "apksigner not found"; exit 1; }

          # build-tools 37 prints "V2 Signer: certificate SHA-256 digest: <hex>"
          # where older ones print "Signer #1 certificate SHA-256 digest: <hex>",
          # so match the shared tail and fold the per-scheme repeats into one.
          read_digest() {
            sed -n 's/.*certificate SHA-256 digest: *//p' |
              tr 'A-Z' 'a-z' | sort -u
          }

          current_certs=$("$apksigner" verify --print-certs "$current_apk" 2>&1) || {
            echo "apksigner verify failed for $current_apk"
            printf '%s\n' "$current_certs"
            exit 1
          }
          current_digest=$(printf '%s\n' "$current_certs" | read_digest)
          test "$(printf '%s\n' "$current_digest" | grep -c .)" = "1" || {
            echo "Expected exactly one signer certificate in $current_apk"
            printf '%s\n' "$current_certs"
            exit 1
          }

          previous_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          previous_apk="previous-apk/VeneraX-${previous_tag#v}.apk"
          mkdir -p previous-apk
          gh release download "$previous_tag" \
            --pattern "VeneraX-${previous_tag#v}.apk" --dir previous-apk
          test -s "$previous_apk" || {
            echo "Missing universal APK in $previous_tag: $previous_apk"
            exit 1
          }
          previous_certs=$("$apksigner" verify --print-certs "$previous_apk" 2>&1) || {
            echo "apksigner verify failed for $previous_apk"
            printf '%s\n' "$previous_certs"
            exit 1
          }
          previous_digest=$(printf '%s\n' "$previous_certs" | read_digest)
          test "$(printf '%s\n' "$previous_digest" | grep -c .)" = "1" || {
            echo "Expected exactly one signer certificate in $previous_apk"
            printf '%s\n' "$previous_certs"
            exit 1
          }
          test "$current_digest" = "$previous_digest" || {
            echo "APK signing certificate mismatch with $previous_tag"
            echo "  current  ($version): $current_digest"
            echo "  previous ($previous_tag): $previous_digest"
            exit 1
          }
          echo "Android signer SHA-256: $current_digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: build/app/outputs/apk/release
          retention-days: 7
  Build_Windows:
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    steps:
      - uses: actions/checkout@v7
      - name: install dependencies
        run: | 
          choco install yq -y
          pip install httpx
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: windows-x64
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: '3.44.3'
          architecture: x64
      - name: Enable MSBuild project timings
        continue-on-error: true
        run: python .github/scripts/desktop_build_timings.py --prepare-windows
      - name: build
        run: |
          flutter pub get
          python windows/build.py
      - name: Report native project timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python .github/scripts/desktop_build_timings.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows_build
          path: build/windows/VeneraX-*
  Build_Linux:
    runs-on: ubuntu-22.04
    if: ${{ !inputs.appimage_run_id && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux') }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          architecture: x64
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev librsvg2-dev libglib2.0-bin glib-networking
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: linux-x64
      - run: python3 debian/build.py x64
      - name: Build AppImage
        run: python3 linux/appimage/build.py x64
      - uses: actions/upload-artifact@v7
        with:
          name: appimage_build
          path: build/linux/x64/release/appimage/*.AppImage
          if-no-files-found: error
      - run: python3 linux/arch/build.py
      - run: |
          sudo rm -rf build/linux/arch/app.tar.gz
          sudo rm -rf build/linux/arch/pkg
          sudo rm -rf build/linux/arch/src
          sudo rm -rf build/linux/arch/PKGBUILD
      # Release files carry the app name; the dpkg/pacman package name stays
      # `venera` so existing installs keep upgrading in place.
      - name: Rename Linux packages
        run: |
          set -euo pipefail
          for f in build/linux/x64/release/debian/venera_*.deb; do
            [ -e "$f" ] || continue
            n="$(basename "$f")"; n="${n#venera_}"
            mv "$f" "$(dirname "$f")/VeneraX-${n//_/-}"
          done
          # The arch package is produced inside Docker via a bind mount, so it
          # is root-owned (same reason the cleanup above needs sudo).
          for f in build/linux/arch/venera-*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            n="$(basename "$f")"
            sudo mv "$f" "$(dirname "$f")/VeneraX-${n#venera-}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb_build
          path: build/linux/x64/release/debian
      - uses: actions/upload-artifact@v7
        with:
          name: arch_build
          path: build/linux/arch/
  Build_Linux_ARM64:
    runs-on: ubuntu-22.04-arm
    if: ${{ !inputs.appimage_run_id && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux') }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          flutter-version: '3.44.3'
      - run: |
          flutter pub get
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev librsvg2-dev libglib2.0-bin glib-networking
      - name: "Patch font"
        run: |
          dart run patch/font.dart
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: linux-arm64
      - run: python3 debian/build.py arm64
      - name: Build AppImage
        run: python3 linux/appimage/build.py arm64
      - uses: actions/upload-artifact@v7
        with:
          name: appimage_arm64_build
          path: build/linux/arm64/release/appimage/*.AppImage
          if-no-files-found: error
      - name: Rename Linux packages
        run: |
          set -euo pipefail
          for f in build/linux/x64/release/debian/venera_*.deb; do
            [ -e "$f" ] || continue
            n="$(basename "$f")"; n="${n#venera_}"
            mv "$f" "$(dirname "$f")/VeneraX-${n//_/-}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb_arm64_build
          path: build/linux/x64/release/debian # This is a bug related to flutter_to_debian, but it's not a big deal.

  Build_HarmonyOS:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || contains(fromJSON('["all","harmonyos","native-cache","mobile-preview"]'), inputs.platform) }}
    env:
      OHOS_CLI_VERSION: '26.0.0.865'
      PACKAGE_HAP: ${{ github.event_name != 'schedule' && inputs.platform != 'native-cache' }}
      ABI: arm64-v8a
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare cloud build directories
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/venerax-ohos" "$GITHUB_SHA"
          {
            echo "VENERAX_OHOS_CHECKOUT=$RUNNER_TEMP/venerax-ohos"
            echo "FLUTTER_OHOS_SDK=$RUNNER_TEMP/flutter-ohos"
            echo "DEVECO_STUDIO=$RUNNER_TEMP/deveco/command-line-tools"
            echo "DEVECO_SDK_HOME=$RUNNER_TEMP/deveco/command-line-tools/sdk"
          } >> "$GITHUB_ENV"
      - name: Identify native build inputs
        id: inputs
        run: |
          set -euo pipefail
          onnx=$(git rev-parse HEAD:tool/build_ohos_onnx.ps1)
          patch=$(git rev-parse HEAD:tool/ohos/onnxruntime.patch)
          rhttp=$(ruby -ryaml -e 'puts YAML.load_file("pubspec.lock").fetch("packages").fetch("rhttp").fetch("description").fetch("sha256")')
          rust=$(git rev-parse HEAD:tool/build_ohos_rhttp.ps1)
          wrapper=$(git rev-parse HEAD:tool/clang_ohos.sh)
          onnx_key="ohos-onnx-linux-$OHOS_CLI_VERSION-$ABI-$onnx-$patch"
          prebuilt=$(jq -r --arg key "$onnx_key" 'select(.build_key == $key) | .sha256' tool/ohos/onnxruntime-prebuilt.json)
          echo "onnx=$onnx_key${prebuilt:+-$prebuilt}" >> "$GITHUB_OUTPUT"
          echo "prebuilt=$prebuilt" >> "$GITHUB_OUTPUT"
          echo "rhttp=ohos-rhttp-linux-$OHOS_CLI_VERSION-$ABI-$rhttp-$rust-$wrapper" >> "$GITHUB_OUTPUT"
      - name: Restore ONNX Runtime
        id: onnx
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.inputs.outputs.onnx }}
          path: |
            ${{ runner.temp }}/venerax-ohos/ohos/entry/libs/${{ env.ABI }}/libonnxruntime.so
            ${{ runner.temp }}/venerax-ohos/ohos/entry/src/main/resources/rawfile/onnxruntime
      - name: Restore rhttp
        id: rhttp
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.inputs.outputs.rhttp }}
          path: ${{ runner.temp }}/venerax-ohos/ohos/entry/libs/${{ env.ABI }}/librhttp.so
      - name: Download published HarmonyOS ONNX Runtime
        if: steps.onnx.outputs.cache-hit != 'true' && steps.inputs.outputs.prebuilt != ''
        env:
          ARCHIVE_SHA256: ${{ steps.inputs.outputs.prebuilt }}
        run: |
          set -euo pipefail
          tag=$(jq -er .tag tool/ohos/onnxruntime-prebuilt.json)
          asset=onnxruntime-ohos-arm64-v8a.tar.gz
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/Kyosee/flutter_onnxruntime/releases/download/$tag/$asset"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$VENERAX_OHOS_CHECKOUT/ohos/entry" \
            "libs/$ABI/libonnxruntime.so" src/main/resources/rawfile/onnxruntime/{LICENSE,ThirdPartyNotices.txt}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache official HarmonyOS tool archive
        id: ohos_tools
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/commandline-tools-linux.zip
          key: harmonyos-cli-linux-x64-${{ env.OHOS_CLI_VERSION }}
      - name: Download official HarmonyOS tools
        if: steps.ohos_tools.outputs.cache-hit != 'true'
        env:
          DEVECO_URL: ${{ secrets.DEVECO_COMMAND_LINE_TOOLS_URL }}
        run: |
          set -euo pipefail
          test -n "$DEVECO_URL" || { echo "DEVECO_COMMAND_LINE_TOOLS_URL is missing"; exit 1; }
          # Secret values pasted or piped from Windows may include a line ending.
          download_url=$(printf '%s' "$DEVECO_URL" | tr -d '\r\n')
          echo "::add-mask::$download_url"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/commandline-tools-linux.zip" "$download_url"
      - name: Save official HarmonyOS tool archive
        if: steps.ohos_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/commandline-tools-linux.zip
          key: harmonyos-cli-linux-x64-${{ env.OHOS_CLI_VERSION }}
      - name: Install HarmonyOS toolchains
        if: env.PACKAGE_HAP == 'true' || steps.rhttp.outputs.cache-hit != 'true' || (steps.onnx.outputs.cache-hit != 'true' && steps.inputs.outputs.prebuilt == '')
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-dev ninja-build
          unzip -q "$RUNNER_TEMP/commandline-tools-linux.zip" -d "$RUNNER_TEMP/deveco"
          test -d "$DEVECO_STUDIO/sdk/default/openharmony/native"
          echo "$DEVECO_STUDIO/bin" >> "$GITHUB_PATH"
          export NODE_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          test -x "$NODE_HOME/bin/node"
          echo "NODE_HOME=$NODE_HOME" >> "$GITHUB_ENV"
          "$DEVECO_STUDIO/bin/hvigorw" --version
      - name: Install Flutter OH
        if: env.PACKAGE_HAP == 'true' || steps.rhttp.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init "$FLUTTER_OHOS_SDK"
          git -C "$FLUTTER_OHOS_SDK" remote add origin https://gitcode.com/CPF-Flutter/flutter_flutter.git
          # Flutter derives its SDK version from the upstream release tag.
          git -C "$FLUTTER_OHOS_SDK" fetch --depth 1 origin tag 3.44.9+ohos-1.0.0-beta
          git -C "$FLUTTER_OHOS_SDK" checkout --detach 744cbb4f08e577787774c04033cc19a9d318d0d2
      - name: Build rhttp on cache miss
        if: steps.rhttp.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$VENERAX_OHOS_CHECKOUT"
          "$FLUTTER_OHOS_SDK/bin/flutter" pub get --enforce-lockfile
          rustup toolchain install 1.95 --profile minimal
          rustup target add --toolchain 1.95 aarch64-unknown-linux-ohos
          pwsh -NoProfile -File tool/build_ohos_rhttp.ps1 -NativeSdk "$DEVECO_STUDIO/sdk/default/openharmony/native" -Abi "$ABI"
      - name: Save rhttp
        if: steps.rhttp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.inputs.outputs.rhttp }}
          path: ${{ runner.temp }}/venerax-ohos/ohos/entry/libs/${{ env.ABI }}/librhttp.so
      - name: Build ONNX Runtime from source
        if: steps.onnx.outputs.cache-hit != 'true' && steps.inputs.outputs.prebuilt == ''
        run: |
          cd "$VENERAX_OHOS_CHECKOUT"
          pwsh -NoProfile -File tool/build_ohos_onnx.ps1 -NativeSdk "$DEVECO_STUDIO/sdk/default/openharmony/native" -Abi "$ABI"
      - name: Check native libraries and redistribution notices
        run: |
          set -euo pipefail
          cd "$VENERAX_OHOS_CHECKOUT/ohos/entry"
          for lib in libonnxruntime.so librhttp.so; do
            readelf -h "libs/$ABI/$lib" | grep -E 'Machine:.*AArch64'
          done
          test -s src/main/resources/rawfile/onnxruntime/LICENSE
          test -s src/main/resources/rawfile/onnxruntime/ThirdPartyNotices.txt
      - name: Save ONNX Runtime
        if: steps.onnx.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.inputs.outputs.onnx }}
          path: |
            ${{ runner.temp }}/venerax-ohos/ohos/entry/libs/${{ env.ABI }}/libonnxruntime.so
            ${{ runner.temp }}/venerax-ohos/ohos/entry/src/main/resources/rawfile/onnxruntime
      - name: Check HarmonyOS native bridges
        if: env.PACKAGE_HAP == 'true'
        run: node --test test/ohos/*.cjs
      - name: Build HarmonyOS ARM64 release package
        if: env.PACKAGE_HAP == 'true'
        shell: pwsh
        run: |
          & .github/scripts/build-harmonyos.ps1 `
            -Checkout $env:VENERAX_OHOS_CHECKOUT `
            -SourceRepository $env:GITHUB_WORKSPACE `
            -Commit $env:GITHUB_SHA `
            -FlutterSdk $env:FLUTTER_OHOS_SDK `
            -DevEcoStudio $env:DEVECO_STUDIO `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'result') `
            -UsePreparedNativeLibraries
      - name: Check reader settings and sync notifications with Flutter OH
        if: env.PACKAGE_HAP == 'true'
        working-directory: ${{ env.VENERAX_OHOS_CHECKOUT }}
        run: |
          "$FLUTTER_OHOS_SDK/bin/flutter" test --no-pub \
            test/reader_settings_search_test.dart test/ohos_transfer_keepalive_test.dart
      - uses: actions/upload-artifact@v7
        if: env.PACKAGE_HAP == 'true'
        with:
          name: harmonyos_build_arm64
          path: result/*.hap
          if-no-files-found: error
          retention-days: 7

  Warm_Prebuilt_ONNX:
    if: github.event_name == 'schedule' || inputs.platform == 'native-cache'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [android, windows-x64, linux-x64, linux-arm64, apple]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: ${{ matrix.platform }}
          warm-only: 'true'

  Publish_Mobile_Preview:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'mobile-preview'
    needs: [Build_Android, Build_HarmonyOS]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: ${{ runner.temp }}/mobile-preview/android
      - uses: actions/download-artifact@v8
        with:
          name: harmonyos_build_arm64
          path: ${{ runner.temp }}/mobile-preview/harmonyos
      - name: Publish validated Android and HarmonyOS packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-mobile-preview.sh

  Test_AppImage:
    needs: [Build_Linux, Build_Linux_ARM64]
    if: ${{ !cancelled() && ((inputs.platform == 'linux' && inputs.appimage_run_id != '') || (needs.Build_Linux.result == 'success' && needs.Build_Linux_ARM64.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            artifact: appimage_build
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact: appimage_arm64_build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: build/appimage
          github-token: ${{ github.token }}
          run-id: ${{ inputs.appimage_run_id || github.run_id }}
      - name: Test AppImage GUI and WebView
        timeout-minutes: 10
        run: |
          chmod +x build/appimage/*.AppImage
          bash linux/appimage/smoke_test.sh build/appimage/*.AppImage
      - name: Upload AppImage runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage_smoke_${{ matrix.arch }}
          path: build/appimage/smoke-test/
          if-no-files-found: ignore

  Android_Deltas:
    needs: Build_Android
    if: github.event_name == 'push' || inputs.platform == 'all'
    permissions:
      contents: read
    uses: ./.github/workflows/update-deltas.yml
    with:
      platform: android

  Windows_Deltas:
    needs: Build_Windows
    if: github.event_name == 'push' || inputs.platform == 'all'
    permissions:
      contents: read
    uses: ./.github/workflows/update-deltas.yml
    with:
      platform: windows

  Merge_Deltas:
    needs: [Android_Deltas, Windows_Deltas]
    if: needs.Android_Deltas.outputs.available == 'true' && needs.Windows_Deltas.outputs.available == 'true'
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      available: ${{ steps.upload.outcome == 'success' }}
      complete: ${{ steps.merge.outcome == 'success' && steps.upload.outcome != 'failure' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deltas-*
          path: delta-parts
      - id: merge
        name: Combine Android and Windows patches
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          python3 tool/build_update_deltas.py merge
          if [[ -f update-deltas/update-manifest.json ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        id: upload
        if: steps.merge.outputs.available == 'true'
        with:
          name: update-deltas
          path: update-deltas/
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  Release:
    runs-on: ubuntu-22.04
    needs: [Build_MacOS, Build_IOS, Build_Android, Build_Windows, Build_Linux, Build_Linux_ARM64, Build_HarmonyOS, Test_AppImage, Merge_Deltas]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
          && needs.Build_MacOS.result == 'success' && needs.Build_IOS.result == 'success'
          && needs.Build_Android.result == 'success' && needs.Build_Windows.result == 'success'
          && needs.Build_Linux.result == 'success' && needs.Build_Linux_ARM64.result == 'success'
          && needs.Build_HarmonyOS.result == 'success' && needs.Test_AppImage.result == 'success' }}
    outputs:
      prerelease: ${{ steps.release_meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: ios_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: windows_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: deb_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: arch_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: deb_arm64_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: appimage_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: appimage_arm64_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: harmonyos_build_arm64
          path: outputs

      - name: Validate release inputs
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing_draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft 2>/dev/null || true)
          if [[ "$existing_draft" == "false" ]]; then
            echo "Release $TAG is already published; refusing to rebuild it"
            exit 1
          fi
          for lang in en zh-CN; do
            notes="release-notes/${TAG}.${lang}.md"
            test -s "$notes" || { echo "Missing or empty $notes"; exit 1; }
          done

          app_version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          version="${app_version%%+*}"
          test -n "$version" || { echo "Missing version in pubspec.yaml"; exit 1; }
          test "$TAG" = "v$version" || {
            echo "Tag $TAG does not match pubspec version $version"
            exit 1
          }

          mkdir -p release-assets
          shopt -s nullglob
          files=(
            outputs/*.ipa outputs/*.dmg outputs/*.apk outputs/*.zip
            outputs/*.exe outputs/*.deb outputs/*.zst outputs/*.AppImage
            "outputs/VeneraX-${app_version}-harmonyos-unsigned.hap"
          )
          test "${#files[@]}" -gt 0 || { echo "No release assets found"; exit 1; }
          cp -- "${files[@]}" release-assets/

          require_asset() {
            compgen -G "$1" > /dev/null || {
              echo "Missing required release asset: $1"
              exit 1
            }
          }
          require_asset "release-assets/VeneraX-ios-${app_version}.ipa"
          require_asset "release-assets/VeneraX-${app_version}.dmg"
          require_asset "release-assets/VeneraX-${version}.apk"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            require_asset "release-assets/VeneraX-${version}-${abi}.apk"
          done
          for arch in amd64 arm64; do
            require_asset "release-assets/VeneraX-${version}-${arch}.deb"
          done
          require_asset "release-assets/VeneraX-${version}-${app_version##*+}-x86_64.pkg.tar.zst"
          require_asset "release-assets/VeneraX-${version}-x86_64.AppImage"
          require_asset "release-assets/VeneraX-${version}-aarch64.AppImage"
          require_asset "release-assets/VeneraX-${version}-windows.zip"
          require_asset "release-assets/VeneraX-${version}-windows-installer.exe"
          require_asset "release-assets/VeneraX-${app_version}-harmonyos-unsigned.hap"
          while IFS= read -r asset; do
            test -s "$asset" || { echo "Empty release asset: $asset"; exit 1; }
          done < <(find release-assets -maxdepth 1 -type f -print)

          body_file="$RUNNER_TEMP/${TAG}.release-body.md"
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/release-notes"
          {
            node .github/scripts/release-downloads.mjs \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$TAG" "$app_version"
            printf '> **Language / 语言**: [English](%s/%s.en.md) · [简体中文](%s/%s.zh-CN.md)\n\n' \
              "$base" "$TAG" "$base" "$TAG"
            cat "release-notes/${TAG}.en.md"
          } > "$body_file"

          prerelease=false
          title="$TAG"
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
            title=$(node .github/scripts/prerelease-title.mjs "$version" release-assets/*)
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"

      - name: Remove obsolete patches from a previous draft attempt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python3 tool/build_update_deltas.py clean-draft
      - name: Download optional incremental packages
        if: needs.Merge_Deltas.result == 'success' && needs.Merge_Deltas.outputs.available == 'true'
        id: deltas
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: update-deltas
          path: update-deltas
      - name: Include verified incremental packages
        id: include_deltas
        if: steps.deltas.outcome == 'success'
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
          BODY_FILE: ${{ steps.release_meta.outputs.body_file }}
        run: python3 tool/build_update_deltas.py publish
      - name: Report unavailable incremental packages
        if: needs.Merge_Deltas.outputs.complete != 'true' || steps.deltas.outcome == 'failure' || steps.include_deltas.outcome == 'failure'
        run: echo '::warning::Incremental updates unavailable. Publishing full packages only.'

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_meta.outputs.title }}
          draft: true
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          body_path: ${{ steps.release_meta.outputs.body_file }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify draft release assets
        id: release_gate
        env:
          TITLE: ${{ steps.release_meta.outputs.title }}
          BODY_FILE: ${{ steps.release_meta.outputs.body_file }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/${TAG}.release.json"
          # A draft release is invisible to the get-release-by-tag endpoint (404
          # even once the tag exists), so locate it in the release list, which is
          # newest-first and does include drafts, then fetch it by id.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$TAG\")) | .[0].id // empty")
          test -n "$release_id" || { echo "No release found for $TAG"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          jq -e '.draft == true' "$release_json" > /dev/null
          jq -e --arg tag "$TAG" --arg title "$TITLE" --argjson prerelease "$PRERELEASE" \
            '.tag_name == $tag and .name == $title and .prerelease == $prerelease and (.body | type == "string" and length > 0)' \
            "$release_json" > /dev/null
          jq -e '.assets | length > 0 and all(.[]; .state == "uploaded" and .size > 0)' \
            "$release_json" > /dev/null

          jq -r '.body' "$release_json" > "$RUNNER_TEMP/remote-release-body.md"
          # jq -r appends a trailing newline the stored body does not carry, so
          # fold trailing blank lines on both sides; real differences still fail.
          diff -u <(printf '%s\n' "$(cat "$BODY_FILE")") \
                  <(printf '%s\n' "$(cat "$RUNNER_TEMP/remote-release-body.md")")

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort \
            > "$RUNNER_TEMP/local-assets.txt"
          jq -r '.assets[].name' "$release_json" | sort \
            > "$RUNNER_TEMP/remote-assets.txt"
          diff -u "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt"

          echo "release_id=$(jq -r '.id' "$release_json")" >> "$GITHUB_OUTPUT"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(release edit "$TAG" --draft=false)
          if [[ "$PRERELEASE" == "false" ]]; then
            latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [[ -n "$latest_tag" && "$latest_tag" != "$TAG" ]]; then
              newest=$(printf '%s\n%s\n' "$latest_tag" "$TAG" | sort -V | tail -1)
              test "$newest" = "$TAG" || {
                echo "Refusing to publish $TAG after newer release $latest_tag"
                exit 1
              }
            fi
            args+=(--latest)
          fi
          gh "${args[@]}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq 'select(.draft == false and .published_at != null) | .html_url'

  Update_AltStore_Source:
    runs-on: ubuntu-22.04
    needs: [Release]
    # Pre-releases are for internal testing only: they must never be pushed to
    # AltStore users. (The in-app updater is safe by itself — GitHub's
    # releases/latest API never returns pre-releases — but this job would
    # otherwise overwrite the manifest with the beta.)
    if: ${{ needs.Release.result == 'success' && needs.Release.outputs.prerelease == 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Gather release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/${TAG}.altstore-release.json"
          gh release view "$TAG" --json assets,publishedAt > "$release_json"
          IPA_COUNT=$(jq '[.assets[] | select(.name | endswith(".ipa"))] | length' "$release_json")
          test "$IPA_COUNT" -eq 1 || { echo "Expected exactly one IPA asset, found $IPA_COUNT"; exit 1; }
          DL=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .url' "$release_json")
          SZ=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .size' "$release_json")
          PUB=$(jq -r '.publishedAt' "$release_json" | cut -dT -f1)
          VER=$(git show "${TAG}:pubspec.yaml" | grep '^version:' | cut -d':' -f2 | tr -d ' ')
          VERSION=${VER%%+*}
          BUILD=${VER##*+}
          test -n "$DL" && test "$DL" != "null" || { echo "IPA URL missing"; exit 1; }
          test "$SZ" -gt 0 || { echo "IPA size is invalid: $SZ"; exit 1; }
          test -n "$PUB" && test "$PUB" != "null" || { echo "Release date missing"; exit 1; }
          test -n "$VERSION" && test "$VERSION" != "$VER" || { echo "Version/build missing: $VER"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "Invalid build number: $BUILD"; exit 1; }
          {
            echo "download_url=$DL"
            echo "size=$SZ"
            echo "pub_date=$PUB"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
      - name: Regenerate AltStore manifest
        env:
          SOURCE_FILE: altstore-source.json
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          DOWNLOAD_URL: ${{ steps.meta.outputs.download_url }}
          SIZE: ${{ steps.meta.outputs.size }}
          PUB_DATE: ${{ steps.meta.outputs.pub_date }}
          MIN_OS: '15.1'
        run: |
          set -euo pipefail
          if [ -f "release-notes/${TAG}.en.md" ]; then
            export NOTES_FILE="release-notes/${TAG}.en.md"
          fi
          node .github/scripts/gen-altstore-source.mjs
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- altstore-source.json; then
            echo "altstore-source.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add altstore-source.json
          git commit -m "chore: 更新 AltStore 安装清单至 ${{ github.ref_name }}"
          git push origin HEAD:master

  # Rebuilds CHANGELOG.md / CHANGELOG_EN.md from release-notes/ after a stable
  # release. Runs after the AltStore job so the two pushes to master don't race,
  # and still runs when that job failed.
  Update_Changelog:
    runs-on: ubuntu-22.04
    needs: [Release, Update_AltStore_Source]
    if: ${{ !cancelled() && needs.Release.result == 'success' && needs.Release.outputs.prerelease == 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Regenerate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export RELEASES_FILE="$RUNNER_TEMP/releases.tsv"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | "\(.tag_name)\t\(.published_at)"' \
            > "$RELEASES_FILE"
          node .github/scripts/gen-changelog.mjs
      - name: Commit if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- CHANGELOG.md CHANGELOG_EN.md)" ]; then
            echo "Changelog unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md CHANGELOG_EN.md
          git commit -m "chore: update changelog for ${{ github.ref_name }}"
          git push origin HEAD:master

  # Beta counterpart of Update_AltStore_Source: pre-releases update ONLY the
  # separate beta manifest, which testers subscribe to explicitly. Stable users
  # (altstore-source.json + the in-app updater) never see these builds.
  Update_AltStore_Beta_Source:
    runs-on: ubuntu-22.04
    needs: [Release]
    if: ${{ needs.Release.result == 'success' && needs.Release.outputs.prerelease == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Gather release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/${TAG}.altstore-release.json"
          gh release view "$TAG" --json assets,publishedAt > "$release_json"
          IPA_COUNT=$(jq '[.assets[] | select(.name | endswith(".ipa"))] | length' "$release_json")
          test "$IPA_COUNT" -eq 1 || { echo "Expected exactly one IPA asset, found $IPA_COUNT"; exit 1; }
          DL=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .url' "$release_json")
          SZ=$(jq -r '.assets[] | select(.name | endswith(".ipa")) | .size' "$release_json")
          PUB=$(jq -r '.publishedAt' "$release_json" | cut -dT -f1)
          VER=$(git show "${TAG}:pubspec.yaml" | grep '^version:' | cut -d':' -f2 | tr -d ' ')
          VERSION=${VER%%+*}
          BUILD=${VER##*+}
          test -n "$DL" && test "$DL" != "null" || { echo "IPA URL missing"; exit 1; }
          test "$SZ" -gt 0 || { echo "IPA size is invalid: $SZ"; exit 1; }
          test -n "$PUB" && test "$PUB" != "null" || { echo "Release date missing"; exit 1; }
          test -n "$VERSION" && test "$VERSION" != "$VER" || { echo "Version/build missing: $VER"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "Invalid build number: $BUILD"; exit 1; }
          {
            echo "download_url=$DL"
            echo "size=$SZ"
            echo "pub_date=$PUB"
            echo "version=$VERSION"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
      - name: Regenerate beta AltStore manifest
        env:
          SOURCE_FILE: altstore-source-beta.json
          BETA: 'true'
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          DOWNLOAD_URL: ${{ steps.meta.outputs.download_url }}
          SIZE: ${{ steps.meta.outputs.size }}
          PUB_DATE: ${{ steps.meta.outputs.pub_date }}
          MIN_OS: '15.1'
        run: |
          set -euo pipefail
          if [ -f "release-notes/${TAG}.en.md" ]; then
            export NOTES_FILE="release-notes/${TAG}.en.md"
          fi
          node .github/scripts/gen-altstore-source.mjs
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- altstore-source-beta.json; then
            echo "altstore-source-beta.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
