name: OCR native verification

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        type: choice
        default: all
        options: [all, desktop, android, apple-runtime]
  push:
    branches: [master]
    paths:
      - 'native/ocr/**'
      - 'lib/foundation/image_translation/detector_*.dart'
      - 'test/ocr_detector_preprocess_test.dart'
      - 'test/ocr_preprocess_probe_test.dart'
      - 'tool/ocr_preprocess_*.dart'
      - '.github/workflows/ocr-native.yml'

permissions:
  contents: read

jobs:
  desktop:
    if: ${{ !inputs.suite || inputs.suite == 'all' || inputs.suite == 'desktop' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            library: venera_ocr.dll
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            channel: master
            library: venera_ocr.dll
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            library: lib/libvenera_ocr.so
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            channel: master
            library: lib/libvenera_ocr.so
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            library: libvenera_ocr.dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            library: libvenera_ocr.dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: ${{ matrix.channel || 'stable' }}
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: flutter pub get --enforce-lockfile
      - name: Compile and test Rust
        run: |
          python native/ocr/build.py --target '${{ matrix.target }}' --output 'build/ocr/${{ matrix.library }}'
          rustc --test --edition=2021 --target '${{ matrix.target }}' native/ocr/detector.rs -o build/ocr/rust-tests.exe
          build/ocr/rust-tests.exe
          python -m unittest discover -s native/ocr -p 'test_*.py'
      - name: Compare native tensors and exercise fallback
        run: |
          library=$(python -c 'from pathlib import Path; print(Path("build/ocr/${{ matrix.library }}").resolve().as_posix())')
          flutter test --no-pub --dart-define=VENERAX_TEST_OCR_NATIVE=true --dart-define=VENERAX_TEST_OCR_LIBRARY="$library" test/ocr_detector_preprocess_test.dart test/ocr_preprocess_probe_test.dart
          flutter test --no-pub --dart-define=VENERAX_TEST_OCR_NATIVE=false --dart-define=VENERAX_TEST_OCR_LIBRARY="$PWD/build/ocr/missing-library" test/ocr_detector_preprocess_test.dart
      - name: Compare Dart and Rust in AOT
        run: |
          library=$(python -c 'from pathlib import Path; print(Path("build/ocr/${{ matrix.library }}").resolve().as_posix())')
          dart compile exe --target-arch=${{ matrix.arch }} -DVENERAX_TEST_OCR_LIBRARY="$library" tool/ocr_preprocess_benchmark.dart -o build/ocr/benchmark.exe
          build/ocr/benchmark.exe --backend=compare --output=build/ocr/compare.json
          build/ocr/benchmark.exe --backend=dart --output=build/ocr/dart-1.json
          build/ocr/benchmark.exe --backend=rust --output=build/ocr/rust-1.json
          build/ocr/benchmark.exe --backend=rust --output=build/ocr/rust-2.json
          build/ocr/benchmark.exe --backend=dart --output=build/ocr/dart-2.json
      - name: Check macOS allocator retention under repeated work
        if: matrix.os == 'macos-15'
        run: |
          build/ocr/benchmark.exe --backend=dart --rounds=150 --output=build/ocr/dart-long.json
          build/ocr/benchmark.exe --backend=rust --rounds=150 --output=build/ocr/rust-long.json
          MallocLargeCache=0 build/ocr/benchmark.exe --backend=dart --output=build/ocr/dart-no-cache.json
          MallocLargeCache=0 build/ocr/benchmark.exe --backend=rust --output=build/ocr/rust-no-cache.json
          for fixture in ordinary scaled rotated wide_fallback; do
            build/ocr/benchmark.exe --backend=dart --case="$fixture" --output="build/ocr/dart-$fixture.json"
            build/ocr/benchmark.exe --backend=rust --case="$fixture" --output="build/ocr/rust-$fixture.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ocr-${{ matrix.target }}
          path: build/ocr/
          if-no-files-found: error

  apple-runtime:
    if: ${{ !inputs.suite || inputs.suite == 'all' || inputs.suite == 'apple-runtime' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-15-intel
            arch: x64
          - platform: macos
            os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select the Apple test SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          architecture: ${{ matrix.arch }}
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: apple
      - run: flutter pub get --enforce-lockfile
      - name: Build and run the packaged iOS simulator probe
        if: matrix.platform == 'ios'
        env:
          # The locked ML Kit frameworks support Intel simulators only.
          FLUTTER_XCODE_ARCHS: x86_64
        run: |
          rustup target add x86_64-apple-ios
          mkdir -p build/ocr
          flutter build ios --simulator --debug --verbose --target tool/ocr_preprocess_probe.dart --dart-define=VENERAX_BENCH_ALLOW_MISSING=true --dart-define=VENERAX_BENCH_ROUNDS=3 --dart-define=VENERAX_BENCH_WARMUPS=1 > build/ocr/ios-build.log 2>&1 || { tail -n 200 build/ocr/ios-build.log; exit 1; }
          python3 native/ocr/verify.py --apple-app build/ios/iphonesimulator/Runner.app
          python3 native/ocr/run_apple_probe.py --platform ios --app build/ios/iphonesimulator/Runner.app
      - name: Build and run the packaged macOS AOT probe
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release --target tool/ocr_preprocess_probe.dart --dart-define=VENERAX_BENCH_ALLOW_MISSING=true
          python3 native/ocr/verify.py --apple-app build/macos/Build/Products/Release/venera.app
          python3 native/ocr/run_apple_probe.py --platform macos --app build/macos/Build/Products/Release/venera.app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ocr-apple-runtime-${{ matrix.platform }}
          path: |
            build/ocr/*.json
            build/ocr/*.log
          if-no-files-found: warn

  android:
    if: ${{ !inputs.suite || inputs.suite == 'all' || inputs.suite == 'android' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          architecture: x64
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/onnx-prebuilt
        with:
          platform: android
      - name: Prepare the existing Android HTTP dependency
        run: bash .github/scripts/android-rhttp.sh
      - name: Prepare test signing
        run: |
          keytool -genkeypair -keystore android/ocr-test.jks -alias ocr-test -keyalg RSA -keysize 2048 -validity 2 -storepass android -keypass android -dname 'CN=OCR Test'
          printf 'storeFile=ocr-test.jks\nstorePassword=android\nkeyAlias=ocr-test\nkeyPassword=android\n' > android/key.properties
      - run: flutter pub get --enforce-lockfile
      - name: Build the AOT comparison probe
        run: flutter build apk --release --target tool/ocr_preprocess_probe.dart
      - name: Verify every packaged CPU library
        run: |
          for apk in build/app/outputs/apk/release/*.apk; do
            python3 native/ocr/verify.py --apk "$apk"
          done
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run AOT on Android x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 native/ocr/run_android_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ocr-android
          path: |
            build/ocr/*.json
            build/ocr/*.log
            build/app/outputs/apk/release/*x86_64.apk
          if-no-files-found: warn
